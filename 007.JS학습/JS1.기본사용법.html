<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>
      JS1. 자바스크립트 기본 + DOM선택법
    </title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* 보이는 화면에 채우기 */
      }
      body {
        overflow: hidden;
      }

.pbox {
        position: absolute;
        top: 0;
        left: 0;
        /* 부모는? window(보이는화면) */
        margin: 0;
        padding: 0;

        width: 500px;
        height: 500px;
        padding-top: 200px;

        /* 글자 */
        line-height: 50px;
        font-size: 30px;
        text-align: center;
        /* 줄바꿈방지 */
        white-space: nowrap;

        border: 27px solid gold;
        /* 보더박스:보더,패딩포함 */
        box-sizing: border-box;
}      
    </style>
  </head>


  <body>
    <!-- 드라마 소개박스 -->
     <p 
     class="pbox" 
     title="클릭하시면 돈이 나옵니다."
     onclick="
    // onclick 이벤트속성은 js와 연결되는 기본속성이다.
    // 이벤트속성 이름은 아래와 같이 구성된다.
    // -> on+이벤트명 예: onclick, onmouseover ...
    // 이벤트속성은 모든 html요소에 줄 수 있다.
    
     // 이 구역은 js코드구역임. 
     // 여기는 js문법만 적용됨.
     // js 한줄주석 
     // 경고창 띄우기
     // js는 전체 html의 지도를 가지고 있음
     // 그 지도명은 document다.
     alert('조현은 세상에서 제일 멋지고 훌륭한 남자입니다.');
     document
    //  가져온 요소들 중 id명으로된 요소를 선택한다.
    // -> getElementById(아이디명)
    // document하위 요소선택시 점(.)을 찍는다.
    // -> get 가져와! Element 요소를! By Id 아이디로!
     .getElementById('name')
    //  하위로 내려갈때 점(.)
    // innerHTML = 코드 
    // js에서 이퀄(=)은 이퀄오른쪽의 값이 이퀄왼쪽으로 들어감을 의미함.
    // innerHTML은 inner 안쪽에 HTML 태그를 넣는 속성.

    // 윈도우키 + V = 지금까지 복사된 내용 리스트에서 선택 - 붙여넣기.
     .innerHTML='위대한 남자입니다.';
     "
     >
      나는 재산이 엄청 많은 부자다. <br>
      그래서 <span id="name">
      </span>
     </p>
  </body>
</html>
