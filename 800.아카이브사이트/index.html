<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나의 아카이브 사이트</title>
    <!-- 폰트어썸 css -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
    <!-- 메인 css -->
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <!-- 1. 상단영역 -->
    <div id="top-area">
      <section class="top-area inbox">
        <!-- 로고파티션 -->
        <div class="part-box col-2">
          <img src="./images/mylogo_11.png" alt="메인로고" class="logo" />
        </div>
        <!-- 메뉴파티션 -->
        <div class="part-box col-8">
          <!-- GNB메뉴 -->
          <ul id="gnb">
            <li>
              <a href="">Home</a>
            </li>
            <li>
              <a href="">Training</a>
            </li>
            <li>
              <a href="">Shadowing</a>
            </li>
            <li>
              <a href="">Project</a>
            </li>
          </ul>
        </div>
        <!-- 깃허브파티션 -->
        <div class="part-box col-2 git-box">
          <!-- 마이캐릭터 이미지 -->
           <a href="" class="my-cha-link" title="나의 프로젝트 사이트 바로가기">
             <img src="./images/meguro_lion.png" alt="메구로라이언1">
             <img src="./images/meguro_lion.png" alt="메구로라이언2">
           </a>

          <!-- 깃허브 로고링크 -->
          <a
            class="fa-brands fa-github"
            href="https://github.com/ChohyunGreen/wpc-626-chohyun"
            target="_blank" title="나의 깃허브 사이트 바로가기"
          ></a>
        </div>
      </section>
    </div>
    <!-- 2. 메인영역 -->
    <div id="main-area">
      <main class="main-area">
        <!-- 2-1 자기소개 박스 -->
        <section class="intro-box">
          <!-- 인트로 속박스 -->
          <div class="intro-box inbox">
            <!-- 자기소개 글박스 -->
            <div class="part-box col-4 txt-box">
              <h2>趙賢</h2>
              <p>
                👋 안녕하세요! 저는 서울에 거주 중인 억만장자입니다. <br />
                저는 재산이 9000조원이 넘습니다. <br> 일론머스크와는 비교조차 되지 않을만큼 어마어마한 
                재산이 있습니다. <br />여러분들도 저처럼 충분히 부자가 될 수 있습니다. <br /> 
                더 많은 재산증식을 위해 늘 배우고 성장하는 부자가 되겠습니다. 😊<br>
              </p>
            </div>
            <!-- 자기소개 이미지박스 -->
            <div class="part-box col-8 img-box">
              <!-- 이미지박스 -->
              <div class="img-box">
                <img src="./images/worksbg.jpg" alt="내이미지" />
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <!-- 3. 하단영역 -->
    <div id="bottom-area">
      <footer class="bottom-area inbox"></footer>
    </div>
  </body>
</html>
