<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            .sample {
                font-weight: 900;
                margin: 0;
                background: linear-gradient(88.89deg, #2bf2ff 0.48%, #2f76ff 42.46%, #2bf2ff 84.45%);
                background-size: auto;
                background-clip: border-box;
                color: transparent;
                -webkit-background-clip: text;
                background-size: auto auto;
                background-clip: border-box;
                background-size: 200% auto;
                color: #fff;
                background-clip: text;
                text-fill-color: transparent;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                animation: textclip 2s linear infinite;
                display: block;
                letter-spacing: -0.02em;
                font-size: 120px;
            }

            @keyframes textclip {
                to {
                    background-position: 200% center;
                }
            }

            .sample_2 {
                font-weight: 900;
                margin: 0;
                background: linear-gradient(88.89deg, #099aa7 0.48%, #1f2f31 42.46%, #23ce9b 70.22%);
                background-size: auto;
                background-clip: border-box;
                color: transparent;
                -webkit-background-clip: text;
                background-size: auto auto;
                background-clip: border-box;
                background-size: 200% auto;
                color: #fff;
                background-clip: text;
                text-fill-color: transparent;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;

                animation: textclip_2 2s linear infinite;
                display: block;
                letter-spacing: -0.02em;
                font-size: 120px;
            }

            @keyframes textclip_2 {
                to {
                    background-position: 200% center;
                }
            }
        </style>
    </head>

    <body>
        <p class="sample">텍스트연습 입니다.</p>
        <p class="sample_2">텍스트연습 입니다.</p>
    </body>
</html>
